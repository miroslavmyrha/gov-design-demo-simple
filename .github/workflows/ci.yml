name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # What ships to users must be free of known critical vulnerabilities. The advisories ignored in
      # package.json (pnpm.auditConfig) are in simple-git, which comes with the Nuxt devtools and
      # runs on a developer's machine only; its fixed version does not work with the devtools yet.
      - run: pnpm audit --prod --audit-level=critical
